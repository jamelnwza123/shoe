<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOLESTEP - สินค้าทั้งหมด</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Filter Bar Styles */
    #filter-bar {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    .filter-btn {
      background: #FFFFFF;
      border: 1px solid var(--slate-grey);
      color: var(--carbon-black);
      padding: 0.5rem 1.25rem;
      border-radius: 20px;
      font-family: var(--font-street);
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .filter-btn.active, .filter-btn:hover {
      background: var(--carbon-black);
      color: var(--bg-sand);
      border-color: var(--carbon-black);
    }
  </style>
</head>
<body>

  <!-- Navbar / Header -->
  <header class="brand-header">
    <h1 class="brand-title"><a href="index.html" style="color: inherit; text-decoration: none;">SOLESTEP</a></h1>
    <p class="brand-subtitle">สินค้าทั้งหมด / Collection</p>
    <nav style="margin-top: 1rem;">
      <a href="index.html" style="color: var(--slate-grey); margin: 0 10px; text-decoration: none;">หน้าแรก</a>
      <a href="product.html" style="color: var(--carbon-black); font-weight: bold; margin: 0 10px; text-decoration: none;">สินค้าทั้งหมด</a>
      <a href="admin.html" style="color: var(--slate-grey); margin: 0 10px; text-decoration: none;">ระบบจัดการ</a>
    </nav>
  </header>

  <main class="product-container">
    <!-- Category Filter Bar -->
    <div id="filter-bar"></div>

    <!-- Product Grid -->
    <div id="product-list" class="product-grid">
      <!-- Loaded dynamically via script.js -->
    </div>
  </main>

  <footer style="text-align: center; margin-top: 4rem; padding: 2rem 0; color: var(--muted-text); font-size: 0.85rem; border-top: 1px solid rgba(0,0,0,0.08);">
    &copy; 2026 SOLESTEP. All rights reserved.
  </footer>

  <script src="script.js"></script>
</body>
</html>
