<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOLESTEP - Admin Orders Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-container {
      max-width: 1200px;
      margin: 0 auto;
      background: #FFFFFF;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }
    th, td {
      padding: 0.85rem 1rem;
      text-align: left;
      border-bottom: 1px solid var(--bg-sand);
      font-size: 0.9rem;
    }
    th {
      background-color: var(--carbon-black);
      color: #FFFFFF;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    tr:hover {
      background-color: rgba(232, 236, 233, 0.4);
    }
  </style>
</head>
<body>

  <header class="brand-header">
    <h1 class="brand-title"><a href="index.html" style="color: inherit; text-decoration: none;">SOLESTEP</a></h1>
    <p class="brand-subtitle">ระบบจัดการรายการสั่งซื้อ (Admin Dashboard)</p>
    <nav style="margin-top: 1rem;">
      <a href="index.html" style="color: var(--slate-grey); margin: 0 10px; text-decoration: none;">หน้าแรก</a>
      <a href="product.html" style="color: var(--slate-grey); margin: 0 10px; text-decoration: none;">สินค้าทั้งหมด</a>
      <a href="admin.html" style="color: var(--carbon-black); font-weight: bold; margin: 0 10px; text-decoration: none;">ระบบจัดการ</a>
    </nav>
  </header>

  <main class="admin-container">
    <h2 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 1rem; color: var(--carbon-black);">รายการสั่งซื้อล่าสุด</h2>
    <div style="overflow-x: auto;">
      <table id="ordersTable">
        <!-- Loaded dynamically via script.js from CSV -->
      </table>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
